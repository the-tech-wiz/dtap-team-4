# ── Network ───────────────────────────────────────────────────────────────────
# Accept MQTT connections on port 1883 from any interface (0.0.0.0)
listener 1883 0.0.0.0

# ── Authentication ────────────────────────────────────────────────────────────
# Allow anonymous connections — safe for initial development.
# For production: set this to false and add a password file.
# See: https://mosquitto.org/documentation/authentication-methods/
allow_anonymous true

# ── Persistence ───────────────────────────────────────────────────────────────
# Persist messages and subscriptions across broker restarts
persistence true
persistence_location /var/lib/mosquitto/

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest    file /var/log/mosquitto/mosquitto.log
log_type    error
log_type    warning
log_type    notice
log_type    information

# ── Limits ────────────────────────────────────────────────────────────────────
max_connections     100
max_keepalive       60

# ── QoS message limits ────────────────────────────────────────────────────────
# Max queued messages per client when they're offline
max_queued_messages 1000
